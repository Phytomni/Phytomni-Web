name: CI

# Shared gate groups run in parallel so a failing contract or static check does
# not wait for the complete frontend runtime suite. The workflow remains a
# contributor-side defense backstop when local hooks are not installed.

permissions:
  contents: read

on:
  pull_request:
  push:
    branches:
      - main
      - "release/**"

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  hygiene:
    name: hygiene
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - name: Checkout (full history for git diff)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install ripgrep (shared hygiene gate)
        run: sudo apt-get update && sudo apt-get install -y ripgrep

      - name: Setup Node 20 (exact static-analysis checker)
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install frontend dependencies for exact checker
        working-directory: apps/web
        run: npm ci

      - name: Cache pinned quality tools
        uses: actions/cache@v4
        with:
          path: .cache/phytomni
          key: phytomni-web-quality-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('scripts/*_runner.sh', 'scripts/quality_runner_common.sh') }}

      - name: Run shared hygiene gate
        run: ./scripts/run_gate_group.sh hygiene

      - name: Scan the whole tree for secrets
        run: python3 scripts/scan_secrets.py --all

  frontend-static:
    name: frontend-static
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 20 (frontend static tools)
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install frontend dependencies
        working-directory: apps/web
        run: npm ci

      - name: Run shared frontend static gate
        run: ./scripts/run_gate_group.sh frontend-static

  frontend-runtime:
    name: frontend-runtime
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 20 (frontend runtime tools)
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install frontend dependencies
        working-directory: apps/web
        run: npm ci

      - name: Run shared frontend runtime gate
        run: ./scripts/run_gate_group.sh frontend-runtime

  server-static:
    name: server-static
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go 1.23 (server static tools)
        uses: actions/setup-go@v5
        with:
          go-version: "1.23"
          cache-dependency-path: apps/server/go.sum

      - name: Cache pinned quality tools
        uses: actions/cache@v4
        with:
          path: .cache/phytomni
          key: phytomni-web-quality-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('scripts/*_runner.sh', 'scripts/quality_runner_common.sh') }}

      - name: Run shared server static gate
        run: ./scripts/run_gate_group.sh server-static

  server-runtime:
    name: server-runtime
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    env:
      PHYTOMNI_RUN_RACE: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go 1.23 (server runtime tools)
        uses: actions/setup-go@v5
        with:
          go-version: "1.23"
          cache-dependency-path: apps/server/go.sum

      - name: Run shared server runtime gate
        run: ./scripts/run_gate_group.sh server-runtime

  contracts:
    name: contracts
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cache pinned quality tools
        uses: actions/cache@v4
        with:
          path: .cache/phytomni
          key: phytomni-web-quality-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('scripts/*_runner.sh', 'scripts/quality_runner_common.sh') }}

      - name: Run shared contract gate
        run: ./scripts/run_gate_group.sh contracts
