name: CI

# Promotes all of scripts/validate_web_local.sh's G-checks from "run locally by
# the developer" to "run automatically on PR + main push", as a contributor-side
# defense backstop: even if someone hasn't installed scripts/install_git_hooks.sh,
# CI still blocks the PR red; it also runs scripts/scan_secrets.py --all once more
# to pin the whole-tree secret scan into CI (not just changed files).
#
# Making the status check a required merge gate is a GitHub repo setting
# (Branches → required status checks), outside the scope of this workflow.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  validate:
    name: validate_web_local.sh + secret scan
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - name: Checkout (full history for git diff)
        uses: actions/checkout@v4
        with:
          # validate_web_local.sh G-1 / G0 use git diff; fetch-depth: 0 gives both the full ref
          fetch-depth: 0

      - name: Setup Node 20 (apps/web vue-tsc / eslint / vite)
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: apps/web/package-lock.json

      - name: Setup Go 1.23 (apps/server gofmt / vet / build)
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          cache-dependency-path: apps/server/go.sum

      - name: Install ripgrep (validate_web_local.sh G-1 secret scan)
        run: sudo apt-get update && sudo apt-get install -y ripgrep

      - name: npm ci (apps/web)
        working-directory: apps/web
        run: npm ci

      - name: validate_web_local.sh full gate (G-1 + G0 + G1..G7.5, G11, G12)
        run: ./scripts/validate_web_local.sh

      - name: scan_secrets.py --all (whole tree, not just changes)
        run: python3 scripts/scan_secrets.py --all
